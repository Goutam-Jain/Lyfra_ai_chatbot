# Render Blueprint (optional): Dashboard -> New -> Blueprint -> pick this repo.
# Secrets marked `sync: false` are asked for in the dashboard; they are never stored in the repo.
services:
  - type: web
    name: lyftr-chat-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://your-frontend.vercel.app
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: CACHE_ENABLED
        value: "true"
      # The free plan has no persistent disk, so this file resets on redeploy.
      # On a paid plan, add a disk mounted at /data to keep history across deploys.
      - key: DATABASE_URL
        value: sqlite:////data/app.db

  - type: web
    name: lyftr-chat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false            # e.g. https://lyftr-chat-backend.onrender.com
